<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAD实战技能 · CAD消防设计与考证知识库</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="page-head">
      <div class="crumb"><a href="学习主页.html">个人知识库</a> / CAD实战技能</div>
      <div class="head-line">
        <div>
          <h1>✒️ CAD实战技能（Lv.1 – Lv.4）</h1>
          <div class="sub">每个技能点都是"可点开学的卡片"：点开看要点，练会了再勾选打卡。按「能画出来 → 画得标准 → 画得专业 → 画得快而准」四级进阶。</div>
        </div>
        <button class="btn ghost" id="btnResetSkills">重置勾选</button>
      </div>
    </div>

    <!-- 四级掌握度概览 -->
    <div class="grid-4" id="lvStats"></div>

    <!-- 技能清单 -->
    <div id="skillArea"></div>

    <div class="foot">知识卡内容基于通用 CAD 教学与消防制图实践整理 · 勾选状态自动保存到本机</div>
  </main>
</div>

<script src="assets/app.js"></script>
<script>
DB.load();
renderNav('CAD实战技能.html');

const skillArea = document.getElementById('skillArea');
const lvStats = document.getElementById('lvStats');

function refreshLvStats() {
  const st = skillStats();
  lvStats.innerHTML = SKILL_TREE.map((lv, i) => {
    const s = st.byLv[i];
    return `
    <div class="stat">
      <div class="k"><span class="lv ${lv.cls}" style="margin-right:6px;">${lv.lv}</span>${lv.name.split('·')[0].trim()}</div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:8px;">
        <div class="bar" style="flex:1;"><i style="width:${s.pct}%"></i></div>
        <span class="pct">${s.pct}%</span>
      </div>
      <div class="tip">${s.done} / ${s.total} 项</div>
    </div>`;
  }).join('');
}

function renderSkills() {
  skillArea.innerHTML = SKILL_TREE.map((lv, li) => {
    const cards = lv.items.map((it, ii) => {
      const key = li + '|' + ii;
      const checked = DB.data.skills[key] ? true : false;
      return `
      <details class="kcard${checked ? ' done' : ''}" data-key="${key}">
        <summary>
          <span class="kc-ico">${checked ? '✓' : (ii + 1)}</span>
          <span class="kc-t">${esc(it.t)}</span>
          <span class="kc-toggle">▶</span>
        </summary>
        <div class="kc-body">
          <div class="kc-text">${esc(it.d)}</div>
          <div class="kc-foot">
            <label><input type="checkbox" data-lv="${li}" data-idx="${ii}"${checked ? ' checked' : ''}> 已能独立完成，打卡</label>
          </div>
        </div>
      </details>`;
    }).join('');
    return `
    <div class="card" id="lv-${li}">
      <h2><span class="lv ${lv.cls}">${lv.lv}</span>${esc(lv.name)} <span class="tag" data-lv-pct="${li}"></span></h2>
      <p class="muted" style="margin:-6px 0 12px;">目标：${esc(lv.goal)}</p>
      ${cards}
    </div>`;
  }).join('');

  skillArea.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => {
      const key = cb.dataset.lv + '|' + cb.dataset.idx;
      const card = cb.closest('.kcard');
      if (cb.checked) DB.data.skills[key] = true;
      else delete DB.data.skills[key];
      card.classList.toggle('done', cb.checked);
      card.querySelector('.kc-ico').textContent = cb.checked ? '✓' : (Number(cb.dataset.idx) + 1);
      DB.save();
      refreshLvStats();
      updateLvTags();
      if (cb.checked) toast('技能点已打卡 ✓');
    });
  });
}

function updateLvTags() {
  const st = skillStats();
  st.byLv.forEach((s, i) => {
    const tag = document.querySelector(`[data-lv-pct="${i}"]`);
    if (tag) tag.textContent = s.pct + '% 完成';
  });
}

document.getElementById('btnResetSkills').onclick = () => {
  const opt = prompt('重置范围：输入 1 = 清空全部勾选；输入等级（1/2/3/4）= 只清空该级', '1');
  if (opt === null) return;
  if (opt === '1') {
    if (confirm('确定清空全部技能点勾选？此操作不可撤销。')) {
      DB.data.skills = {}; DB.save();
      renderSkills(); refreshLvStats(); toast('已清空全部勾选');
    }
  } else if (['1','2','3','4'].includes(opt.trim())) {
    const li = Number(opt.trim()) - 1;
    if (confirm(`确定清空 Lv.${li + 1} 的全部勾选？`)) {
      SKILL_TREE[li].items.forEach((_, ii) => delete DB.data.skills[li + '|' + ii]);
      DB.save();
      renderSkills(); refreshLvStats(); toast(`Lv.${li + 1} 已重置`);
    }
  } else if (opt.trim() !== '') {
    toast('输入无效，未做修改');
  }
};

renderSkills();
refreshLvStats();
updateLvTags();
</script>
</body>
</html>

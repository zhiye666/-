<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>进度追踪 · CAD消防设计与考证知识库</title>
<meta name="description" content="进度追踪：技能掌握度、考试倒计时与学习日志。">
<meta name="theme-color" content="#c0322b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="page-head">
      <div class="crumb"><a href="index.html">个人知识库</a> / 进度追踪</div>
      <h1>📈 进度追踪与备考状态</h1>
      <div class="sub">一页看清：技能树点亮到哪了、离考试还有几天、本周学了多少。技能点在「CAD实战技能」页勾选，本页自动汇总。</div>
    </div>

    <!-- 顶部：总掌握度 + 倒计时 -->
    <div class="grid-2">
      <div class="card" style="margin:0;">
        <h2>🌳 技能树掌握度</h2>
        <div class="bar-row" style="margin-bottom:14px;">
          <span style="font-weight:700;">总进度</span>
          <div class="bar"><i id="totalBar" style="width:0%"></i></div>
          <span class="pct" id="totalPct">0%</span>
        </div>
        <div id="lvBars"></div>
        <div class="note blue" style="margin-top:14px;" id="lvAdvice"></div>
      </div>

      <div class="card" style="margin:0;">
        <h2>⏳ 考试倒计时</h2>
        <div id="examWidgets"></div>
        <div class="form-row" style="margin-top:14px;">
          <div>
            <label>一消考试日期</label>
            <input type="date" id="dateYx">
          </div>
          <div>
            <label>消防设施操作员考试日期</label>
            <input type="date" id="dateCz">
          </div>
        </div>
        <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn" data-primary-action id="btnSaveExam">保存考试日期</button>
          <button class="btn ghost" id="btnClearExam">清除</button>
        </div>
        <div class="small" style="margin-top:10px;">提示：日期仅为备考参考，实际以官方通知为准。</div>
      </div>
    </div>

    <!-- 学习数据摘要 -->
    <div class="grid-3" style="margin-top:18px;">
      <div class="stat">
        <div class="k">实战测验正确率</div>
        <div class="v" id="statQuiz">—</div>
        <div class="tip" id="statQuizTip">已完成 0 / 0 题</div>
      </div>
      <div class="stat">
        <div class="k">错题待掌握</div>
        <div class="v" id="statMk">0</div>
        <div class="tip" id="statMkTip">未复盘 0 · 已复盘 0</div>
      </div>
      <div class="stat">
        <div class="k">最近 12 条日志时长合计</div>
        <div class="v" id="statHours">0<small> 小时</small></div>
        <div class="tip" id="statHoursTip">坚持记录，曲线不会骗人</div>
      </div>
    </div>

    <!-- 每周学习日志 -->
    <div class="card">
      <h2>📅 学习日志 <span class="tag">建议每周日填</span></h2>
      <div class="form-grid">
        <div class="form-row">
          <div><label>日期</label><input type="date" id="logDate"></div>
          <div><label>本周学习时长（小时）</label><input type="number" id="logHours" min="0" step="0.5" placeholder="如：6.5"></div>
        </div>
        <div class="form-row">
          <div><label>本周重点内容</label><input type="text" id="logFocus" placeholder="如：Lv.2 图层体系 + 一消实务第3章"></div>
          <div><label>状态自评</label>
            <select id="logMood">
              <option>充实高效</option><option>正常推进</option><option>有点吃力</option><option>需要调整</option>
            </select>
          </div>
        </div>
        <div><label>本周复盘一句话</label><textarea id="logNote" placeholder="哪块做得好？下周改什么？"></textarea></div>
      </div>
      <div style="margin-top:14px;"><button class="btn" data-primary-action id="btnSaveLog">记录这条日志</button></div>

      <h3 style="margin-top:22px;">历史日志</h3>
      <div id="logList"></div>
    </div>

    <!-- 数据备份 -->
    <div class="card">
      <h2>💾 数据备份与恢复</h2>
      <p class="muted" style="margin-bottom:12px;">所有学习数据保存在本机浏览器中。换电脑、重装系统或清理浏览器数据前，请先导出备份。</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn green" id="btnExport">导出备份（JSON）</button>
        <button class="btn ghost" id="btnImport">导入备份</button>
        <input type="file" id="fileImport" accept=".json,application/json" style="display:none;">
        <button class="btn danger-ghost" id="btnReset">清空全部数据</button>
      </div>
    </div>

    <div class="foot">进度数据自动保存到本机浏览器</div>
  </main>
</div>

<script src="assets/app.js"></script>
<script>
DB.load();
renderNav('progress.html');

/* ---------- 技能树汇总 ---------- */
function renderSkillSummary() {
  const st = skillStats();
  document.getElementById('totalBar').style.width = st.pct + '%';
  document.getElementById('totalPct').textContent = st.pct + '%';
  const clsMap = ['blue', 'green', '', ''];
  document.getElementById('lvBars').innerHTML = SKILL_TREE.map((lv, i) => {
    const s = st.byLv[i];
    const barCls = i === 0 ? 'blue' : i === 1 ? 'green' : '';
    return `
    <div class="bar-row" style="margin-bottom:10px;">
      <span class="lv ${lv.cls}" style="min-width:40px;">${lv.lv.slice(2)}</span>
      <div class="bar ${barCls}"><i style="width:${s.pct}%"></i></div>
      <span class="pct">${s.pct}%</span>
    </div>`;
  }).join('');

  // 建议
  let advice;
  const idx = st.byLv.findIndex(s => s.pct < 100);
  if (idx === -1) advice = '🎉 四级技能点全部点亮！保持手感，重点转向出图速度与规范应用。';
  else advice = `当前主攻方向：<b>${SKILL_TREE[idx].lv} ${SKILL_TREE[idx].name}</b>（完成 ${st.byLv[idx].pct}%）。建议先把本级点满再进入下一级。`;
  document.getElementById('lvAdvice').innerHTML = advice;
}

/* ---------- 考试倒计时 ---------- */
function renderExam() {
  document.getElementById('dateYx').value = DB.data.exam.yx || '';
  document.getElementById('dateCz').value = DB.data.exam.cz || '';
  document.getElementById('examWidgets').innerHTML = examWidgets().map(w => `
    <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);">
      <div style="flex:1;">
        <div style="font-weight:700;font-size:14px;">${esc(w.name)}</div>
        <div class="small">${esc(w.tip)}</div>
      </div>
      <div style="font-size:24px;font-weight:800;color:${w.value === '未设置' ? 'var(--ink-3)' : 'var(--red)'};">${esc(w.value)}</div>
    </div>`).join('');
}
document.getElementById('btnSaveExam').onclick = () => {
  DB.data.exam.yx = document.getElementById('dateYx').value;
  DB.data.exam.cz = document.getElementById('dateCz').value;
  DB.save(); renderExam(); toast('考试日期已保存');
};
document.getElementById('btnClearExam').onclick = () => {
  DB.data.exam = { yx: '', cz: '' };
  DB.save(); renderExam(); toast('已清除考试日期');
};

/* ---------- 数据摘要 ---------- */
function renderStats() {
  const answered = DB.data.quiz.answered || 0;
  const correct = DB.data.quiz.correct || 0;
  document.getElementById('statQuiz').textContent =
    answered ? Math.round(correct / answered * 100) + '%' : '—';
  document.getElementById('statQuizTip').textContent =
    '已完成 ' + answered + ' / ' + QUIZ_BANK.length + ' 题';
  const mk = DB.data.mistakes;
  const pending = mk.filter(m => m.status !== '已掌握').length;
  document.getElementById('statMk').textContent = pending;
  document.getElementById('statMkTip').textContent =
    '未复盘 ' + mk.filter(m => m.status === '未复盘').length +
    ' · 已复盘 ' + mk.filter(m => m.status === '已复盘').length;
  const hours = DB.data.logs.slice(-12).reduce((s, l) => s + (Number(l.hours) || 0), 0);
  document.getElementById('statHours').innerHTML = hours.toFixed(1) + '<small> 小时</small>';
}

/* ---------- 学习日志 ---------- */
document.getElementById('logDate').value = fmtDate(new Date().toISOString());
const logList = document.getElementById('logList');

document.getElementById('btnSaveLog').onclick = () => {
  const hours = Number(document.getElementById('logHours').value);
  if (!hours || hours <= 0) { toast('请填写有效的学习时长'); return; }
  DB.data.logs.push({
    id: uid(),
    date: document.getElementById('logDate').value || fmtDate(new Date().toISOString()),
    hours: hours,
    focus: document.getElementById('logFocus').value.trim(),
    mood: document.getElementById('logMood').value,
    note: document.getElementById('logNote').value.trim()
  });
  DB.save();
  document.getElementById('logHours').value = '';
  document.getElementById('logFocus').value = '';
  document.getElementById('logNote').value = '';
  toast('日志已记录');
  renderLogs(logList); renderStats();
};

/* ---------- 备份 ---------- */
document.getElementById('btnExport').onclick = () => DB.export();
document.getElementById('btnImport').onclick = () => document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange = e => {
  const f = e.target.files[0];
  if (f) DB.import(f);
  e.target.value = '';
};
document.getElementById('btnReset').onclick = () => {
  if (!confirm('确定清空全部学习数据（技能点、笔记、错题、日志、考试日期）？此操作不可撤销，建议先导出备份。')) return;
  if (!confirm('再次确认：真的要清空吗？')) return;
  DB.reset();
  location.reload();
};

renderSkillSummary();
renderExam();
renderStats();
renderLogs(logList);
</script>
</body>
</html>
